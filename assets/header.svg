<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Furkan Saygın — embedded systems, C, electronics and AI agent tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d2733" stroke-width="1"/>
    </pattern>
    <style>
      .trace{fill:none;stroke:#24533f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .pad{fill:#0b0f14;stroke:#3ddc97;stroke-width:2}
      .pulse{fill:#3ddc97}
      .px{fill:#3ddc97}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .alien{animation:bob 3.2s ease-in-out infinite}
      @keyframes run{0%{offset-distance:0%}100%{offset-distance:100%}}
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- PCB traces -->
  <path class="trace" d="M0 64H120l32 32h88"/>
  <path class="trace" d="M0 256H96l40-40h104"/>
  <path class="trace" d="M1280 48H1120l-28 28H980"/>
  <path class="trace" d="M1280 272H1150l-36-36h-90"/>
  <path class="trace" d="M1080 320v-40l24-24"/>
  <circle class="pad" cx="240" cy="96" r="6"/>
  <circle class="pad" cx="240" cy="216" r="6"/>
  <circle class="pad" cx="980" cy="76" r="6"/>
  <circle class="pad" cx="1024" cy="236" r="6"/>
  <circle class="pulse" r="3.5">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M0 64H120l32 32h88"/>
  </circle>
  <circle class="pulse" r="3.5">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M1280 272H1150l-36-36h-90"/>
  </circle>

  <!-- chip with pixel alien -->
  <g transform="translate(278 88)">
    <g fill="#24533f">
      <rect x="-14" y="18" width="14" height="6"/><rect x="-14" y="42" width="14" height="6"/>
      <rect x="-14" y="66" width="14" height="6"/><rect x="-14" y="90" width="14" height="6"/>
      <rect x="-14" y="114" width="14" height="6"/>
      <rect x="144" y="18" width="14" height="6"/><rect x="144" y="42" width="14" height="6"/>
      <rect x="144" y="66" width="14" height="6"/><rect x="144" y="90" width="14" height="6"/>
      <rect x="144" y="114" width="14" height="6"/>
    </g>
    <rect width="144" height="144" rx="10" fill="#0e151d" stroke="#2f6d52" stroke-width="2"/>
    <circle cx="16" cy="16" r="4" fill="#2f6d52"/>
    <g class="alien" transform="translate(28 34)">
      <!-- 11 x 8 sprite, 8px cells -->
      <g class="px">
        <rect x="24" y="0" width="40" height="8"/>
        <rect x="16" y="8" width="56" height="8"/>
        <rect x="8" y="16" width="16" height="8"/><rect x="32" y="16" width="24" height="8"/><rect x="64" y="16" width="16" height="8"/>
        <rect x="8" y="24" width="72" height="8"/>
        <rect x="0" y="32" width="88" height="8"/>
        <rect x="16" y="40" width="8" height="8"/><rect x="40" y="40" width="8" height="8"/><rect x="64" y="40" width="8" height="8"/>
        <rect x="8" y="48" width="8" height="8"/><rect x="72" y="48" width="8" height="8"/>
        <rect x="0" y="56" width="8" height="8"/><rect x="80" y="56" width="8" height="8"/>
      </g>
      <rect x="24" y="16" width="8" height="8" fill="#0e151d"/>
      <rect x="56" y="16" width="8" height="8" fill="#0e151d"/>
    </g>
    <text x="72" y="132" text-anchor="middle" class="mono" font-size="11" fill="#3e7d61" letter-spacing="2">RSP-0</text>
  </g>

  <!-- text -->
  <text x="490" y="128" class="mono" font-size="18" fill="#3ddc97" letter-spacing="1">// not from the world</text>
  <text x="488" y="190" class="sans" font-size="64" font-weight="700" fill="#e8eef4">Furkan Saygın</text>
  <text x="490" y="232" class="mono" font-size="20" fill="#8b9bab">embedded systems · C · electronics · AI agent tooling</text>
  <text x="490" y="262" class="mono" font-size="16" fill="#5b6b7b">$ make things that run close to the metal<tspan class="cursor" fill="#3ddc97" font-weight="700">_</tspan></text>
</svg>
